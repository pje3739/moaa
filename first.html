
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moaa</title>
    <link rel="stylesheet" href="first.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="first.js" defer></script>
</head>
<body>
    <header>
        
<header class="site-header">
    <h1 class="logo"><span>moaa</span></h1>
</header>

    </header>

   
<main>
    <!-- 화면 1: 약속 만들기 -->
    <section id="create-screen">
        <h2>약속 투표 만들기</h2>
        

        <form id="create-form">
            <div>
                <label for="title">약속 이름</label>
                <input
                    type="text"
                    id="title"
                    placeholder="예: 오랜만에 우리 모임"
                    required
                >
            </div>

            <div>
                <label for="host-name">만든 사람</label>
                <input
                    type="text"
                    id="host-name"
                    maxlength="20"
                    placeholder="이름을 입력해 주세요"
                    required
                >
            </div>

            <div>
                <label for="place">장소</label>
                <input
                    type="text"
                    id="place"
                    placeholder="예: 서면역 근처"
                >
            </div>

            <div>
                <label for="start-date">시작 날짜</label>
                <input type="date" id="start-date" required>
            </div>

            <div>
                <label for="end-date">마지막 날짜</label>
                <input type="date" id="end-date" required>
            </div>

            <div>
                <label for="start-time">하루 시작 시간</label>
                <input type="time" id="start-time" required>
            </div>

            <div>
                <label for="end-time">하루 마지막 시간</label>
                <input type="time" id="end-time" required>
            </div>

            <div>
                <label for="interval">시간 간격</label>
                <select id="interval">
                    <option value="30">30분</option>
                    <option value="60" selected>1시간</option>
                    <option value="120">2시간</option>
                </select>
            </div>

            <button id="generate" type="button">
                투표 페이지 만들기
            </button>
        </form>
    </section>

    <!-- 화면 2: 투표하기 -->
    <section id="vote-screen" hidden>
        <h2 id="vote-title">약속 투표</h2>
        <p id="vote-place"></p>
        <p>참여할 수 있는 시간에 체크해 주세요!</p>

        <label for="voter-name">내 이름</label>
        <input
            type="text"
            id="voter-name"
            placeholder="이름을 입력해 주세요"
        >

        <div id="slots" aria-label="날짜별 투표 시간 후보"></div>

        <button id="submit-vote" type="button">
            투표 제출하기
        </button>

        <h3>현재 인기 순위</h3>
        <ol id="ranking"></ol>

        <button id="back-button" type="button">
            약속 설정으로 돌아가기
        </button>
    </section>
</main>


    <footer>
        <p>u__nii0</p>
    </footer>
</body>
</html>
